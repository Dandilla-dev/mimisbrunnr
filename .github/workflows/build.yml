# Сборка установщиков под Windows, macOS и Linux на серверах GitHub.
# Запускается вручную (вкладка Actions → Build → Run workflow) или при теге v*.
name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: dist:linux
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: magistr-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
